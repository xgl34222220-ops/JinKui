# 把账本 UI 原型发布成 GitHub Pages。
# 纯静态（无构建步骤），只上传 design/prototype 目录。
# 用途：设计评审。内容全部是虚构示例数据，不含任何真实信息。
name: pages

on:
  push:
    branches: [arena/77afd5f8-jinkui, main]
    paths:
      - "design/prototype/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Upload prototype
        uses: actions/upload-pages-artifact@v3
        with:
          path: design/prototype

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
